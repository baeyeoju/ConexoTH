<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConexoTH - Daily Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. CORE STYLES --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --primary-blue: #009afe;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --success-green: #22c55e;
            --progress-yellow: #eab308;
            --card-height: 60px;
            --gap-size: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            /* ลดขนาดฟอนต์ลงเล็กน้อย (จาก 18px -> 16px) */
            font-size: 16px; 
        }

        .container {
            max-width: 500px; /* ปรับความกว้างให้เหมาะสมกับฟอนต์ใหม่ */
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* --- 2. MAIN MENU --- */
        .main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .logo-section { margin-bottom: 30px; text-align: center; }
        .game-logo-text { font-size: 3em; font-weight: 800; letter-spacing: 2px; line-height: 1; }
        .game-subtitle { color: var(--text-muted); font-size: 1.1em; margin-top: 10px; }

        .daily-game-wrapper { width: 100%; display: flex; justify-content: center; margin-bottom: 30px; }
        
        .daily-game-card {
            background: #1e293b;
            border: 3px solid #ffffff; 
            border-radius: 16px;
            padding: 15px 25px;
            width: auto; 
            min-width: 300px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .daily-game-card:hover { transform: none; border-color: #ffffff; }

        .daily-text-group { display: flex; flex-direction: column; text-align: left; }
        .daily-label { font-size: 1.2em; font-weight: 700; color: white; }
        .daily-date { font-size: 1em; color: var(--text-muted); margin-top: 4px; }

        .play-btn-small {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s;
        }
        .play-btn-small:hover { background: #0077c2; }

        .menu-list { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .menu-item {
            background: transparent; color: var(--text-muted); border: 1px solid transparent;
            padding: 12px 25px; font-size: 1.1em; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            border-radius: 12px; transition: all 0.25s; width: fit-content; min-width: 200px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }

        /* --- 3. CALENDAR SYSTEM --- */
        .calendar-header { display: flex; align-items: stretch; padding: 5px 10px 15px 10px; gap: 5px; }
        .cal-nav-btn {
            background: #1e293b; border: none; color: white; font-size: 1em; cursor: pointer;
            padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            transition: background 0.25s;
        }
        .cal-nav-btn:hover:not(:disabled) { background: #334155; opacity: 1; }
        .cal-nav-btn:disabled { opacity: 0.2; cursor: default; background: transparent; }

        .cal-title {
            background: transparent; font-size: 1.1em; font-weight: 700; cursor: pointer;
            padding: 10px; border-radius: 8px; flex: 1; text-align: center;
            display: flex; align-items: center; justify-content: center; transition: background 0.25s;
        }
        .cal-title:hover { background: #334155; }

        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 2px; /* ลดช่องว่างระหว่าง column */
            padding: 0 10px; 
        }
        .day-name { text-align: center; color: #64748b; font-size: 0.8em; margin-bottom: 5px; font-weight: bold; }
        
        /* ปรับปุ่มวันที่ให้เล็กลงและคงที่ */
        .day-cell {
            width: 40px;  /* กำหนดขนาดตายตัว */
            height: 40px; /* กำหนดขนาดตายตัว */
            margin: 2px auto; /* จัดกึ่งกลางในช่อง Grid */
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; 
            font-weight: bold; position: relative;
            background: transparent; border: 1px solid transparent;
            cursor: pointer; transition: all 0.25s; 
            font-size: 0.9em;
        }
        .day-cell.completed { background: var(--success-green); color: white; }
        .day-cell.in-progress { background: var(--progress-yellow); color: #0f172a; }
        .day-cell.available:hover { background: #334155; border-color: #475569; }
        .day-cell.today-marker { border: 2px solid var(--primary-blue); box-shadow: 0 0 5px rgba(0,154,254,0.3); }
        .day-cell.future, .day-cell.no-data { opacity: 0.2; cursor: default; pointer-events: none; }

        .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; padding: 0 10px; }
        .month-cell {
            background: transparent; border: 1px solid transparent; padding: 15px 5px;
            border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: 0.25s;
        }
        .month-cell:hover:not(.disabled) { background: var(--card-hover); color: white; }
        .month-cell.active { background: var(--primary-blue) !important; color: white; }
        .month-cell.disabled { opacity: 0.2; cursor: default; pointer-events: none; }

        /* --- 4. GAME SCREEN --- */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .game-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .back-btn { background: transparent; color: white; border: none; font-size: 1.5em; cursor: pointer; padding: 5px; }
        .screen-title { flex: 1; text-align: center; font-size: 1.5em; font-weight: bold; }

        .stats-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 20px; 
            color: white; 
            font-weight: 700; 
            font-size: 0.9em;
            white-space: nowrap;
        }
        .stats-val { font-weight: 400; margin: 0 2px; color: white; }
        .stats-spacer { display: inline-block; width: 6px; } 

        .game-controls { display: flex; gap: 8px; }
        .btn-small {
            background: #334155; color: white; border: none;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em;
        }
        .btn-small:hover:not(:disabled) { background: #475569; }
        .btn-small:disabled { opacity: 0.5; cursor: not-allowed; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 25px; position: relative; }
        
        .word-card {
            background: var(--card-bg); border-radius: 8px; height: var(--card-height);
            display: flex; align-items: center; justify-content: center;
            text-align: center; cursor: pointer; font-weight: 500; font-size: 1em;
            user-select: none; padding: 2px;
            position: relative; 
            transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1), background-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
        }
        .word-card:hover:not(.selected):not(.solved):not(.animating) { background: var(--card-hover); }
        .word-card.selected { background: var(--primary-blue); color: white; }
        .word-card.incorrect { animation: shake 0.4s; background: #ef4444 !important; }
        .word-card.fade-out { opacity: 0; pointer-events: none; }
        
        .ghost-card {
            position: absolute; z-index: 999;
            background: var(--card-bg); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 500; font-size: 1em; color: white;
            transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1), opacity 0.25s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

        .btn-submit {
            width: 100%; padding: 15px; border: 1px solid #334155; border-radius: 12px;
            font-size: 1.1em; font-weight: bold; cursor: pointer;
            background: #1e293b; color: white; transition: 0.25s;
        }
        .btn-submit:hover:not(:disabled) { background: #334155; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-submit.game-over { opacity: 0.5; cursor: default; background: #0f172a; border-color: #1e293b; }

        .hint-triangle {
            position: absolute; top: 0; right: 0; width: 0; height: 0;
            border-style: solid; border-width: 0 15px 15px 0; pointer-events: none;
        }

        .win-card-inline {
            background: #151e32; border-radius: 16px; padding: 25px;
            text-align: center; margin: 0 auto 25px auto; width: 95%; display: none;
        }
        .emoji-grid { font-size: 1.5em; letter-spacing: 3px; margin-bottom: 20px; }
        .share-btn {
            background: var(--primary-blue); color: white; border: none;
            padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em;
        }

        .solved-group {
            background: #334155; margin-bottom: 8px; padding: 5px 10px; border-radius: 8px;
            text-align: center; height: var(--card-height); display: flex; flex-direction: column; justify-content: center;
        }
        .solved-group.new-reveal { animation: fadeOnly 0.5s ease forwards; }

        @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainMenu" class="screen active">
            <div class="main-menu">
                <div class="logo-section">
                    <div class="game-logo-text">CONEXOTH</div>
                    <div class="game-subtitle">จัดกลุ่มคำที่เกี่ยวข้องกัน</div>
                </div>
                <div class="daily-game-wrapper">
                    <div class="daily-game-card">
                        <div class="daily-text-group">
                            <div class="daily-label">โจทย์วันนี้</div>
                            <div class="daily-date" id="dailyDateText">--/--/--</div>
                        </div>
                        <button class="play-btn-small" onclick="startDailyGame()">เล่น</button>
                    </div>
                </div>
                <div class="menu-list">
                    <button class="menu-item" onclick="openCalendar()">
                        <i class="fa-regular fa-calendar"></i> เล่นย้อนหลัง
                    </button>
                    <button class="menu-item" onclick="window.open('https://forms.gle/XYZ', '_blank')">
                        <i class="fa-solid fa-pen-to-square"></i> เสนอโจทย์
                    </button>
                    <button class="menu-item" onclick="window.open('#', '_blank')">
                        <i class="fa-regular fa-comment-dots"></i> Feedback
                    </button>
                    <button class="menu-item" onclick="alert('พัฒนาโดยครูผู้สอนภาษาไทยและคณิตศาสตร์')">
                        <i class="fa-solid fa-circle-info"></i> About
                    </button>
                </div>
            </div>
        </div>

        <div id="calendarScreen" class="screen">
            <div class="game-header">
                <button class="back-btn" onclick="showScreen('mainMenu')"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="screen-title">เล่นย้อนหลัง</div>
                <div style="width: 30px;"></div>
            </div>
            <div class="calendar-header">
                <button class="cal-nav-btn" id="prevBtn" onclick="shiftCalendar(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="cal-title" id="calTitleBtn" onclick="toggleMonthView()">February 2026</div>
                <button class="cal-nav-btn" id="nextBtn" onclick="shiftCalendar(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="daysView">
                <div class="calendar-grid">
                    <div class="day-name">อา</div><div class="day-name">จ</div><div class="day-name">อ</div>
                    <div class="day-name">พ</div><div class="day-name">พฤ</div><div class="day-name">ศ</div><div class="day-name">ส</div>
                </div>
                <div id="calendarDays" class="calendar-grid" style="margin-top: 5px;"></div>
            </div>
            <div id="monthsView" style="display: none;">
                <div class="month-grid" id="monthList"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <button class="back-btn" onclick="backToCalendarOrMenu()">✕</button>
                <div class="screen-title">ConexoTH</div>
                <div style="width: 30px;"></div>
            </div>

            <div id="winCard" class="win-card-inline">
                <div style="font-size:1.5em; font-weight:bold; margin-bottom:10px;">🎉 ยินดีด้วย 🎉</div>
                <div style="color:#cbd5e1; margin-bottom:15px;">
                    คุณทายถูกใน <span id="finalGuess" style="color:#009afe; font-weight:bold;">0</span> ครั้ง<br>
                    และใช้คำใบ้ <span id="finalHint" style="color:#009afe; font-weight:bold;">0</span> ครั้ง
                </div>
                <div class="emoji-grid" id="winHistory"></div>
                <button class="share-btn" id="shareBtn" onclick="shareStats()">
                    <i class="fa-solid fa-share-nodes"></i> แชร์
                </button>
            </div>

            <div class="stats-row">
                <div class="stats-info">
                    <span id="gameDateLabel">--/--/----</span>
                    <span class="stats-spacer"></span>
                    ทาย: <span id="guessCount" class="stats-val">0</span> 
                    <span class="stats-spacer"></span>
                    คำใบ้: <span id="hintCount" class="stats-val">0</span>
                </div>
                <div class="game-controls">
                    <button class="btn-small" id="shuffleBtn" onclick="shuffleWords()">🔀 สลับตำแหน่ง</button>
                    <button class="btn-small" id="hintBtn" onclick="useHint()">💡 คำใบ้</button>
                </div>
            </div>

            <div id="solvedGroups"></div>
            <div class="grid" id="grid"></div>
            
            <button class="btn-submit" id="submitBtn" disabled onclick="checkAnswer()">ส่งคำตอบ</button>
        </div>
    </div>

    <script src="games.js"></script>

    <script>
        // --- STATE VARIABLES ---
        let currentViewDate = new Date(); 
        let isMonthPickerMode = false;
        
        let currentGameDateStr = null;
        let gameData = null;
        let currentWords = [];
        let selectedWords = [];
        let solvedGroups = [];
        let guessCount = 0;
        let hintUsedCount = 0;
        let gameHistory = [];
        let currentHintGroup = null;
        let hintWordsShownCount = 0;
        let hintedWords = [];
        let fromScreen = 'mainMenu';

        const STORAGE_KEY = 'conexo_th_progress';
        let userProgress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        function getThaiDate() {
            return new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Bangkok"}));
        }

        function getTodayStr() {
            const d = getThaiDate();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatDisplayDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${parseInt(d)}/${parseInt(m)}/${y}`;
        }

        function hasGamesInMonth(year, monthIndex) {
            const prefix = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
            return Object.keys(gamesDatabase).some(key => key.startsWith(prefix));
        }

        function init() {
            const todayStr = getTodayStr();
            document.getElementById('dailyDateText').textContent = formatDisplayDate(todayStr);
            currentViewDate = getThaiDate(); 
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openCalendar() {
            fromScreen = 'calendarScreen';
            currentViewDate = getThaiDate(); 
            isMonthPickerMode = false;
            renderCalendar();
            showScreen('calendarScreen');
        }

        function backToCalendarOrMenu() {
            if (fromScreen === 'calendarScreen') {
                showScreen('calendarScreen');
                renderCalendar();
            } else {
                showScreen('mainMenu');
            }
        }

        function toggleMonthView() {
            isMonthPickerMode = !isMonthPickerMode;
            renderCalendar();
        }

        function shiftCalendar(delta) {
            if (isMonthPickerMode) currentViewDate.setFullYear(currentViewDate.getFullYear() + delta);
            else currentViewDate.setMonth(currentViewDate.getMonth() + delta);
            renderCalendar();
        }

        function selectMonth(monthIndex) {
            currentViewDate.setMonth(monthIndex);
            isMonthPickerMode = false;
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const todayStr = getTodayStr();
            const monthNamesThai = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            
            if (isMonthPickerMode) {
                document.getElementById('calTitleBtn').textContent = `${year}`;
                document.getElementById('daysView').style.display = 'none';
                document.getElementById('monthsView').style.display = 'block';
                document.getElementById('prevBtn').disabled = false;
                document.getElementById('nextBtn').disabled = false;

                const monthList = document.getElementById('monthList');
                monthList.innerHTML = '';
                monthNamesThai.forEach((mName, idx) => {
                    const el = document.createElement('div');
                    el.className = 'month-cell';
                    if (idx === month) el.classList.add('active');
                    const hasGame = hasGamesInMonth(year, idx);
                    if (!hasGame) el.classList.add('disabled');
                    el.textContent = mName;
                    el.onclick = () => { if (hasGame) selectMonth(idx); };
                    monthList.appendChild(el);
                });
            } else {
                document.getElementById('calTitleBtn').textContent = `${monthNamesThai[month]} ${year}`;
                document.getElementById('daysView').style.display = 'block';
                document.getElementById('monthsView').style.display = 'none';

                let prevDate = new Date(year, month - 1, 1);
                document.getElementById('prevBtn').disabled = !hasGamesInMonth(prevDate.getFullYear(), prevDate.getMonth());
                let nextDate = new Date(year, month + 1, 1);
                document.getElementById('nextBtn').disabled = !hasGamesInMonth(nextDate.getFullYear(), nextDate.getMonth());

                const daysContainer = document.getElementById('calendarDays');
                daysContainer.innerHTML = '';
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) daysContainer.appendChild(document.createElement('div'));

                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const el = document.createElement('div');
                    el.className = 'day-cell';
                    el.textContent = i;
                    if (dStr === todayStr) el.classList.add('today-marker');
                    if (dStr > todayStr) el.classList.add('future'); 
                    else if (!gamesDatabase[dStr]) el.classList.add('no-data'); 
                    else {
                        const prog = userProgress[dStr];
                        if (prog) {
                            if (prog.status === 'finished') el.classList.add('completed');
                            else if (prog.status === 'playing' && (prog.guessCount > 0 || prog.hintUsedCount > 0)) el.classList.add('in-progress');
                            else el.classList.add('available'); 
                        } else el.classList.add('available'); 
                        el.onclick = () => loadGame(dStr);
                    }
                    daysContainer.appendChild(el);
                }
            }
        }

        function startDailyGame() {
            fromScreen = 'mainMenu';
            loadGame(getTodayStr());
        }

        function loadGame(dateStr) {
            if (!gamesDatabase[dateStr]) { alert("ยังไม่มีโจทย์สำหรับวันนี้"); return; }
            currentGameDateStr = dateStr;
            gameData = gamesDatabase[dateStr];
            document.getElementById('gameDateLabel').textContent = formatDisplayDate(dateStr);

            const saved = userProgress[dateStr];
            if (saved) {
                guessCount = saved.guessCount || 0;
                hintUsedCount = saved.hintUsedCount || 0;
                solvedGroups = saved.solvedGroups || [];
                gameHistory = saved.gameHistory || [];
                currentHintGroup = saved.currentHintGroup !== undefined ? saved.currentHintGroup : null;
                hintWordsShownCount = saved.hintWordsShownCount || 0;
                hintedWords = saved.hintedWords || [];

                currentWords = [];
                gameData.groups.forEach((g, i) => {
                    if (!solvedGroups.includes(i)) {
                        g.words.forEach(w => currentWords.push({ word: w, groupIndex: i }));
                    }
                });
                if (saved.status === 'playing') currentWords.sort(() => Math.random() - 0.5);
            } else {
                guessCount = 0; hintUsedCount = 0; solvedGroups = []; gameHistory = [];
                currentHintGroup = null; hintWordsShownCount = 0; hintedWords = [];
                currentWords = [];
                gameData.groups.forEach((g, i) => {
                    g.words.forEach(w => currentWords.push({ word: w, groupIndex: i }));
                });
                currentWords.sort(() => Math.random() - 0.5);
                saveProgress('playing');
            }

            selectedWords = [];
            
            const btnSubmit = document.getElementById('submitBtn');
            btnSubmit.classList.remove('game-over');
            btnSubmit.disabled = true;

            const solvedContainer = document.getElementById('solvedGroups');
            solvedContainer.innerHTML = '';
            solvedGroups.forEach(gIdx => {
                const group = gameData.groups[gIdx];
                appendSolvedGroup(group, false);
            });

            renderGrid();         
            showScreen('gameScreen');

            if (solvedGroups.length === 4) {
                showWinState();
            } else {
                document.getElementById('winCard').style.display = 'none';
                btnSubmit.style.display = 'block'; 
                updateUIState();
            }
        }

        function appendSolvedGroup(group, animate) {
            const solvedContainer = document.getElementById('solvedGroups');
            const d = document.createElement('div');
            d.className = 'solved-group';
            if (animate) d.classList.add('new-reveal');
            d.style.backgroundColor = group.color;
            d.innerHTML = `<h3 style="color:white; margin:0; font-size:1em;">${group.category}</h3><p style="color:white; opacity:0.9; margin:2px 0 0 0; font-size:0.9em;">${group.words.join(', ')}</p>`;
            solvedContainer.appendChild(d);
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const selectedSet = new Set(selectedWords.map(el => el.dataset.word));

            currentWords.forEach(obj => {
                const c = document.createElement('div');
                c.className = 'word-card';
                c.textContent = obj.word;
                c.dataset.word = obj.word;
                c.dataset.group = obj.groupIndex;
                c.onclick = () => selectCard(c);
                
                if (selectedSet.has(obj.word)) {
                    c.classList.add('selected');
                }

                if (hintedWords.includes(obj.word)) {
                    const tri = document.createElement('div');
                    tri.className = 'hint-triangle';
                    tri.style.borderColor = `transparent ${gameData.groups[obj.groupIndex].color} transparent transparent`;
                    c.appendChild(tri);
                }
                grid.appendChild(c);
            });
            
            selectedWords = Array.from(grid.querySelectorAll('.word-card.selected'));
            updateUIState();
        }

        function updateUIState() {
            document.getElementById('guessCount').textContent = guessCount;
            document.getElementById('hintCount').textContent = hintUsedCount;
            const submitBtn = document.getElementById('submitBtn');
            if (solvedGroups.length !== 4) {
                submitBtn.disabled = selectedWords.length !== 4;
            }
            document.getElementById('shuffleBtn').disabled = solvedGroups.length === 4;
            updateHintBtnState();
        }

        function selectCard(card) {
            if (card.classList.contains('fade-out') || card.classList.contains('animating')) return;
            if (card.classList.contains('selected')) {
                card.classList.remove('selected');
                selectedWords = selectedWords.filter(c => c.dataset.word !== card.dataset.word);
            } else {
                if (selectedWords.length < 4) {
                    card.classList.add('selected');
                    selectedWords.push(card);
                }
            }
            document.getElementById('submitBtn').disabled = selectedWords.length !== 4;
        }

        function checkAnswer() {
            if (selectedWords.length !== 4) return;
            guessCount++;
            
            const firstIdx = parseInt(selectedWords[0].dataset.group);
            const isMatch = selectedWords.every(c => parseInt(c.dataset.group) === firstIdx);

            if (isMatch) {
                const group = gameData.groups[firstIdx];
                gameHistory.push({ type: 'correct', color: group.color });
                
                const grid = document.getElementById('grid');
                const allCards = Array.from(grid.children);

                const correctCardsDOM = [];
                const remainingCardsDOM = [];

                group.words.forEach(w => {
                    const c = allCards.find(card => card.dataset.word === w);
                    if(c) correctCardsDOM.push(c);
                });
                
                allCards.forEach(c => {
                    if (!correctCardsDOM.includes(c)) remainingCardsDOM.push(c);
                });

                const firstRects = new Map();
                allCards.forEach(c => firstRects.set(c, c.getBoundingClientRect()));

                const fragment = document.createDocumentFragment();
                correctCardsDOM.forEach(c => fragment.appendChild(c));   
                remainingCardsDOM.forEach(c => fragment.appendChild(c)); 
                grid.appendChild(fragment);

                const lastRects = new Map();
                Array.from(grid.children).forEach(c => lastRects.set(c, c.getBoundingClientRect()));

                Array.from(grid.children).forEach(c => {
                    const first = firstRects.get(c);
                    const last = lastRects.get(c);
                    
                    if (first && last) {
                        const dx = first.left - last.left;
                        const dy = first.top - last.top;
                        
                        c.style.transition = 'none';
                        c.style.transform = `translate(${dx}px, ${dy}px)`;
                    }

                    if (correctCardsDOM.includes(c)) {
                        c.classList.remove('selected');
                        c.style.backgroundColor = group.color;
                        c.style.color = 'white';
                        c.style.zIndex = '100'; 
                    }
                });

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        Array.from(grid.children).forEach(c => {
                            // ปรับเวลาวิ่งเป็น 0.8s
                            c.style.transition = 'transform 0.8s cubic-bezier(0.2, 0, 0, 1)';
                            c.style.transform = ''; 
                        });
                    });
                });

                if (currentHintGroup === firstIdx) {
                    currentHintGroup = null; hintWordsShownCount = 0;
                }

                // Sequence: Move(0.8s) + Hold(0.5s) = 1.3s
                setTimeout(() => {
                    correctCardsDOM.forEach(c => c.remove());

                    solvedGroups.push(firstIdx);
                    currentWords = currentWords.filter(w => w.groupIndex !== firstIdx);
                    selectedWords = [];

                    appendSolvedGroup(group, true);

                    document.getElementById('submitBtn').disabled = true;
                    
                    saveProgress();
                    
                    if (solvedGroups.length === 4) {
                        saveProgress('finished');
                        setTimeout(showWinState, 500);
                    }

                }, 1300);

            } else {
                gameHistory.push({ type: 'wrong' });
                selectedWords.forEach(c => {
                    c.classList.add('incorrect');
                    setTimeout(() => c.classList.remove('incorrect'), 500);
                });
                setTimeout(() => {
                    selectedWords.forEach(c => c.classList.remove('selected'));
                    selectedWords = [];
                    document.getElementById('submitBtn').disabled = true;
                }, 600);
                saveProgress('playing');
            }
            document.getElementById('guessCount').textContent = guessCount;
        }

        function useHint() {
            const unsolvedIndices = gameData.groups.map((g, i) => i).filter(i => !solvedGroups.includes(i));
            if (unsolvedIndices.length === 0) return;

            if (currentHintGroup !== null && solvedGroups.includes(currentHintGroup)) {
                currentHintGroup = null; hintWordsShownCount = 0;
            }
            if (currentHintGroup === null) {
                currentHintGroup = unsolvedIndices[Math.floor(Math.random() * unsolvedIndices.length)];
                hintWordsShownCount = 0;
            }
            
            if (hintWordsShownCount >= 3) {
                updateHintBtnState();
                return;
            }

            const targets = Array.from(document.querySelectorAll('.word-card')).filter(c => 
                parseInt(c.dataset.group) === currentHintGroup && !c.querySelector('.hint-triangle')
            );

            if (targets.length > 0) {
                const card = targets[Math.floor(Math.random() * targets.length)];
                const tri = document.createElement('div');
                tri.className = 'hint-triangle';
                tri.style.borderColor = `transparent ${gameData.groups[currentHintGroup].color} transparent transparent`;
                card.appendChild(tri);

                hintedWords.push(card.dataset.word);
                hintWordsShownCount++;
                hintUsedCount++;
                gameHistory.push({ type: 'hint' });
                
                document.getElementById('hintCount').textContent = hintUsedCount;
                updateHintBtnState();
                saveProgress('playing');
            }
        }
        
        function updateHintBtnState() {
            const btn = document.getElementById('hintBtn');
            if (hintWordsShownCount >= 3 || solvedGroups.length === 4) {
                btn.disabled = true;
            } else {
                btn.disabled = false;
            }
        }

        function shuffleWords() {
            // 1. Remember selection
            const selectedValues = selectedWords.map(c => c.dataset.word);
            
            // 2. Old Positions
            const grid = document.getElementById('grid');
            const cards = Array.from(grid.children);
            const oldPositions = cards.map(c => {
                const r = c.getBoundingClientRect();
                return { word: c.dataset.word, x: r.left, y: r.top };
            });

            // 3. Shuffle Data
            for (let i = currentWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
            }
            
            // 4. Render Grid (Pass selection logic inside)
            renderGrid();
            
            // 5. Animate
            const newCards = Array.from(grid.children);
            requestAnimationFrame(() => {
                newCards.forEach(newCard => {
                    const word = newCard.dataset.word;
                    const oldPos = oldPositions.find(p => p.word === word);
                    
                    if(oldPos) {
                        const newRect = newCard.getBoundingClientRect();
                        const dx = oldPos.x - newRect.left;
                        const dy = oldPos.y - newRect.top;
                        
                        newCard.style.transition = 'none';
                        newCard.style.transform = `translate(${dx}px, ${dy}px)`;
                        
                        void newCard.offsetWidth;
                        
                        requestAnimationFrame(() => {
                            newCard.style.transition = 'transform 0.5s ease';
                            newCard.style.transform = '';
                        });
                    }
                });
                
                // Fix: ล้าง transition เพื่อให้ CSS class ทำงานต่อได้ (แก้เรื่องเลือกคำแล้วไม่ Fade)
                setTimeout(() => {
                    newCards.forEach(c => c.style.transition = '');
                }, 500);
            });
            saveProgress('playing');
        }

        function saveProgress(status) {
            if (!currentGameDateStr) return;
            userProgress[currentGameDateStr] = {
                status: status || (solvedGroups.length === 4 ? 'finished' : 'playing'),
                guessCount, hintUsedCount, solvedGroups, gameHistory,
                currentHintGroup, hintWordsShownCount, hintedWords
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
        }

        function showWinState() {
            let h = "";
            gameHistory.forEach(x => {
                if(x.type === 'wrong') h += '❌';
                else if(x.type === 'hint') h += '💡';
                else {
                    const c = x.color;
                    if(c==='#c2410c') h+='🟧'; else if(c==='#047857') h+='🟩'; 
                    else if(c==='#0e7490') h+='🟦'; else h+='🟪';
                }
            });
            document.getElementById('winHistory').textContent = h;
            document.getElementById('finalGuess').textContent = guessCount;
            document.getElementById('finalHint').textContent = hintUsedCount;
            document.getElementById('winCard').style.display = 'block';
            
            const btn = document.getElementById('submitBtn');
            btn.style.display = 'block';
            btn.disabled = true;
            btn.classList.add('game-over');
        }

        function shareStats() {
            const text = `ConexoTH ${formatDisplayDate(currentGameDateStr)}\nทาย: ${guessCount} | คำใบ้: ${hintUsedCount}\n${document.getElementById('winHistory').textContent}`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('shareBtn');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> คัดลอกแล้ว!';
                setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-share-nodes"></i> แชร์', 2000);
            });
        }

        init();
    </script>
</body>
</html>
